<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPIC Animatic Embed Workaround Test</title>
  <style>
    :root {
      --ink: #15100c;
      --clay: #c66d2f;
      --soft-clay: #f2cf8d;
      --paper: #f9e4b2;
      --line: #2b160c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(90deg, rgba(42, 20, 10, 0.18) 1px, transparent 1px),
        linear-gradient(rgba(42, 20, 10, 0.18) 1px, transparent 1px),
        var(--clay);
      background-size: 32px 32px;
    }

    header {
      padding: 18px 22px;
      color: var(--soft-clay);
      background: var(--ink);
      border-bottom: 6px solid var(--line);
      box-shadow: 0 6px 0 rgba(43, 22, 12, 0.55);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 0.95;
      text-transform: uppercase;
    }

    main {
      display: grid;
      gap: 18px;
      width: min(1180px, calc(100% - 24px));
      margin: 22px auto 48px;
    }

    .note,
    .card {
      border: 4px solid var(--line);
      background: var(--paper);
      box-shadow: 7px 7px 0 rgba(43, 22, 12, 0.72);
    }

    .note {
      padding: 14px 16px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 640px));
      gap: 18px;
      justify-content: center;
    }

    .card {
      display: grid;
      grid-template-rows: auto auto;
    }

    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 4px solid var(--line);
      background: #f6d79a;
    }

    .head-text {
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 4px;
      font-size: 25px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 13px;
      color: #5f2b13;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta a {
      color: inherit;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .favorite-button {
      width: 52px;
      height: 52px;
      min-height: 0;
      padding: 0;
      border: 0;
      color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .favorite-button:hover,
    .favorite-button.is-favorite {
      background: transparent;
      box-shadow: none;
    }

    .favorite-button img {
      display: block;
      width: 43px;
      height: 43px;
      object-fit: contain;
      opacity: 0.56;
      filter:
        grayscale(1)
        drop-shadow(1px 1px 0 rgba(43, 22, 12, 0.16));
      transition: filter 140ms ease, opacity 140ms ease, transform 140ms ease;
    }

    .favorite-button:hover img {
      opacity: 0.86;
      filter:
        brightness(0)
        saturate(100%)
        invert(23%)
        sepia(24%)
        saturate(1161%)
        hue-rotate(84deg)
        brightness(92%)
        contrast(89%)
        drop-shadow(1px 2px 0 rgba(13, 44, 19, 0.24));
      transform: translate(-1px, -1px);
    }

    .favorite-button.is-favorite img {
      opacity: 1;
      filter:
        brightness(0)
        saturate(100%)
        invert(17%)
        sepia(51%)
        saturate(913%)
        hue-rotate(84deg)
        brightness(94%)
        contrast(93%)
        drop-shadow(2px 3px 0 rgba(13, 44, 19, 0.38));
    }

    .favorite-button.is-favorite:hover img {
      opacity: 1;
      filter:
        brightness(0)
        saturate(100%)
        invert(17%)
        sepia(51%)
        saturate(913%)
        hue-rotate(84deg)
        brightness(94%)
        contrast(93%)
        drop-shadow(2px 3px 0 rgba(13, 44, 19, 0.38));
    }

    .player-slot {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #140f0b;
      overflow: hidden;
    }

    .player-slot iframe,
    .player-slot img,
    .thumb-button {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-slot iframe,
    .player-slot img {
      object-fit: cover;
    }

    .thumb-button {
      position: absolute;
      inset: 0;
      min-height: 0;
      padding: 0;
      color: var(--soft-clay);
      background: #140f0b;
      box-shadow: none;
      cursor: pointer;
    }

    .thumb-button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.16);
      transition: background 140ms ease;
    }

    .thumb-button:hover {
      transform: none;
      box-shadow: none;
    }

    .thumb-button:hover::after {
      background: rgba(0, 0, 0, 0.26);
    }

    .play-triangle {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 86px;
      height: 66px;
      transform: translate(-50%, -50%);
      border: 4px solid var(--line);
      background: rgba(242, 207, 141, 0.92);
      box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.55);
    }

    .play-triangle::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 52%;
      transform: translate(-38%, -50%);
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 24px solid var(--line);
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 11px;
      border: 3px solid var(--line);
      color: var(--ink);
      background: var(--soft-clay);
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
      font: 700 13px Arial, Helvetica, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    a.button:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <header>
    <h1>Invidious Embed Test</h1>
  </header>

  <main>
    <section class="note">
      Official YouTube iframes returned error 150 for most EPIC animatics. This page tests
      a static-site-compatible workaround: iframe an Invidious embed page instead. The
      working shape is <code>https://invidious.tiekoetter.com/embed/VIDEO_ID</code>.
    </section>

    <section id="cards" class="grid"></section>
  </main>

  <script>
    const INVIDIOUS = "https://invidious.tiekoetter.com";
    const LAUREL_SVG = "https://openclipart.org/download/202710/1412278626.svg";
    const videos = [
      { id: "W1voPFcG5Pc", artist: "Orange", title: "Dangerous | EPIC: The Musical Animatic" },
      { id: "zJhJ5E1hK2A", artist: "Zieru", title: "Dangerous | EPIC: The Musical Animatic" },
      { id: "enyLVAd4_hA", artist: "Ximena N.", title: "Dangerous | EPIC: The Musical Animatic" },
      { id: "DIN2S94xsJg", artist: "Noir", title: "Dangerous | EPIC: The Musical Animatic" },
      { id: "0IJsfKItXq0", artist: "BrittPowwPixel", title: "Dangerous | EPIC: The Musical Animatic" },
      { id: "M7lc1UVf-VE", artist: "YouTube control", title: "Official IFrame API demo video" }
    ];

    const cards = document.querySelector("#cards");

    for (const video of videos) {
      const card = document.createElement("article");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      head.innerHTML = `
        <h2 title="${escapeHtml(video.artist)}">${escapeHtml(video.artist)}</h2>
        <div class="meta">${escapeHtml(video.title)} · ${video.id}</div>
      `;

      const youtubeUrl = `https://www.youtube.com/watch?v=${video.id}`;
      head.innerHTML = `
        <div class="head-text">
          <h2 title="${escapeHtml(video.artist)}">${escapeHtml(video.artist)}</h2>
          <div class="meta">
            <a href="${youtubeUrl}" target="_blank" rel="noopener" title="Open on YouTube">
              ${escapeHtml(video.title)} &middot; ${video.id}
            </a>
          </div>
        </div>
      `;

      const favorite = document.createElement("button");
      favorite.className = "favorite-button";
      favorite.type = "button";
      favorite.title = "Mark as favorite";
      favorite.setAttribute("aria-label", `Mark ${video.artist} as favorite`);
      favorite.setAttribute("aria-pressed", "false");
      favorite.innerHTML = `
        <img src="${LAUREL_SVG}" alt="" aria-hidden="true">
      `;
      favorite.addEventListener("click", () => {
        const active = favorite.classList.toggle("is-favorite");
        favorite.setAttribute("aria-pressed", String(active));
        favorite.title = active ? "Marked as favorite" : "Mark as favorite";
      });
      head.append(favorite);

      const slot = document.createElement("div");
      slot.className = "player-slot";

      const img = document.createElement("img");
      img.src = `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`;
      img.alt = "";

      const load = document.createElement("button");
      load.className = "thumb-button";
      load.type = "button";
      load.title = "Load Invidious player";
      load.setAttribute("aria-label", `Load Invidious player for ${video.artist}`);
      load.append(img);
      load.append(document.createElement("span"));
      load.lastElementChild.className = "play-triangle";
      load.addEventListener("click", () => {
        const iframe = document.createElement("iframe");
        iframe.src = `${INVIDIOUS}/embed/${video.id}?autoplay=0`;
        iframe.title = `${video.artist} - ${video.title}`;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        slot.replaceChildren(iframe);
      });

      slot.append(load);
      card.append(head, slot);
      cards.append(card);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }
  </script>
</body>
</html>
